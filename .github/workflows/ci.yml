name: CI

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t owprov:test .

  rbac-lab-integration-tests:
    name: Spin up Containers & Run RBAC Lab Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Go environment
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build Local owprov Docker Image
      run: |
        docker build -t owprov:test .

    - name: Spin up Docker Containers in GitHub Actions Environment
      run: |
        docker rm -f postgres owsec owprov 2>/dev/null || true
        docker network create openwifi 2>/dev/null || true
        docker run -d --name postgres --network openwifi -e POSTGRES_PASSWORD=postgrespassword -e POSTGRES_USER=postgres -e POSTGRES_DB=openwifi postgres:15-alpine
        
        echo "Waiting for Postgres to be ready..."
        until docker exec postgres pg_isready -U postgres; do sleep 2; done

        docker run -d --name owsec --network openwifi -p 16001:16001 \
          -e TEMPLATE_CONFIG=true \
          -e STORAGE_TYPE=postgresql \
          -e STORAGE_TYPE_POSTGRESQL_HOST=postgres \
          -e STORAGE_TYPE_POSTGRESQL_USERNAME=postgres \
          -e STORAGE_TYPE_POSTGRESQL_PASSWORD=postgrespassword \
          -e STORAGE_TYPE_POSTGRESQL_DATABASE=openwifi \
          ghcr.io/routerarchitects/ra-owsec:v1.0.0
        
        echo "Waiting for owsec service startup..."
        sleep 15

        docker run -d --name owprov --network openwifi -p 16005:16005 \
          -e TEMPLATE_CONFIG=true \
          -e STORAGE_TYPE=postgresql \
          -e STORAGE_TYPE_POSTGRESQL_HOST=postgres \
          -e STORAGE_TYPE_POSTGRESQL_USERNAME=postgres \
          -e STORAGE_TYPE_POSTGRESQL_PASSWORD=postgrespassword \
          -e STORAGE_TYPE_POSTGRESQL_DATABASE=openwifi \
          -e SECURITY_SERVER_URI=https://owsec:16001 \
          owprov:test
        
        echo "Waiting for owprov service startup..."
        sleep 15

    - name: Run Root RBAC Lab Test Suite
      run: |
        cd tests/lab_tests
        TEST_CSV=owprov_rbac_v2_1_root_lab_test_cases.csv RESULTS_CSV=rbac_root_actual_results.csv go run main.go

    - name: Run Admin RBAC Lab Test Suite
      run: |
        cd tests/lab_tests
        TEST_CSV=owprov_rbac_v2_1_admin_lab_test_cases.csv RESULTS_CSV=rbac_admin_actual_results.csv go run main.go

    - name: Dump Container Logs on Failure
      if: failure()
      run: |
        echo "=== Postgres Logs ==="
        docker logs postgres || true
        echo "=== OWSEC Logs ==="
        docker logs owsec || true
        echo "=== OWPROV Logs ==="
        docker logs owprov || true

  openapi-validation:
    name: Validate OpenAPI Schemas
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Redocly CLI
      run: npm install -g @redocly/cli@2.41.1

    - name: Validate OpenAPI Specifications with Redocly
      run: |
        mapfile -d '' files < <(
          find openapi -type f \( -name '*.yaml' -o -name '*.yml' \) -print0
        )

        if (( ${#files[@]} == 0 )); then
          echo "ERROR: No OpenAPI specification files found in openapi/ directory!" >&2
          exit 1
        fi

        redocly lint -- "${files[@]}" || echo "Redocly validation completed with findings."

  shell-script-check:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Check Shell Scripts Syntax
      run: |
        set -euo pipefail

        while IFS= read -r -d '' file; do
          if [[ "$file" == *.sh ]] || head -n 1 "$file" | grep -qE '^#!.*/(ba)?sh([[:space:]]|$)'; then
            echo "Checking syntax: $file"
            bash -n "$file"
          fi
        done < <(
          find . -type f \( -name '*.sh' -o -perm -111 \) \
            -not -path '*/.git/*' \
            -not -path '*/build/*' \
            -not -path '*/cmake-build/*' \
            -not -path '*/node_modules/*' \
            -print0
        )
